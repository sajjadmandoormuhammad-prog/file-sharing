<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Share</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      text-align: center;
      padding: 50px 20px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px #ccc;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>📁 File Share</h1>

    <p>اپنی فائل Upload کریں اور Share Link حاصل کریں۔</p>

    <form action="/upload" method="POST" enctype="multipart/form-data">

      <input type="file" name="file" required>

      <br><br>

      <button type="submit">فائل Upload کریں</button>

    </form>
  </div>

</body>
</html>
